[package]
name = "Rust_Learn"
version = "0.1.0"
edition = "2024"
# for disable auto detect main script in project
autobins = false

# for costumize main script
[[bin]]
name = "Rust_Learn"
path = "src/app.rs"

[dependencies]
hello_cargo = { path = "hello_cargo" }
guessing_game = { path = "guessing_game" }
variables = { path = "variables" }
data_types = { path = "data_types" }
inquire = "0.9.5"
strum = { version = "0.28.0", features = ["derive"] }